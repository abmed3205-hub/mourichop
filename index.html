<!DOCTYPE html>

    <title>متجرك الشامل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: #0f172a; color: #fff; }

        .feed {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .img-link {
            display: block;
            width: 100%;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .img-link img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .img-link:active img {
            transform: scale(0.99);
            opacity: 0.94;
        }

        .whatsapp-box {
            margin: 14px 0 24px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            padding: 14px 32px;
            border-radius: 50px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: 0.25s;
        }

        .btn-whatsapp:hover { transform: scale(1.02); }
    </style>
</head>

    </main>

    <script>
        let userScrolled = false;

        window.addEventListener('scroll', () => {
            if (window.scrollY > 80) {
                userScrolled = true;
            }
        });

        setTimeout(() => {
            if (!userScrolled) {
                const nextSec = document.getElementById('sec-store');
                if (nextSec) nextSec.scrollIntoView({ behavior: 'smooth' });
            }
        }, 40000);
    </script>

</body>
</html>
