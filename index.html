<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرك الشامل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: #0f172a; color: #fff; }

        .feed {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #131c31;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #1e293b;
        }

        .section-card img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
        }

        .actions {
            margin-top: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 28px;
            border-radius: 50px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            transition: 0.25s;
        }

        .btn-whatsapp:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <main class="feed">
        <!-- 1. القسم الأول: شحن دولي عالمي -->
        <section id="sec-shipping" class="section-card">
            <img src="shipping.jpg" alt="شحن دولي عالمي">
            <div class="actions">
                <a href="https://wa.me/22200000000?text=مرحباً،%20أريد%20الاستفسار%20عن%20الشحن%20الدولي" class="btn-whatsapp">تواصل واتساب</a>
            </div>
        </section>

        <!-- 2. القسم الثاني: المتجر -->
        <section id="sec-store" class="section-card">
            <img src="store.jpg" alt="متجر شامل">
            <div class="actions">
                <a href="https://wa.me/22200000000?text=مرحباً،%20أريد%20الطلب%20من%20المتجر" class="btn-whatsapp">تواصل واتساب</a>
            </div>
        </section>
    </main>

    <script>
        let userScrolled = false;

        window.addEventListener('scroll', () => {
            if (window.scrollY > 80) {
                userScrolled = true;
            }
        });

        setTimeout(() => {
            if (!userScrolled) {
                const nextSec = document.getElementById('sec-store');
                if (nextSec) nextSec.scrollIntoView({ behavior: 'smooth' });
            }
        }, 40000);
    </script>

</body>
</html>
