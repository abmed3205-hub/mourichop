<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الجمال والأنوثة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }
        img {
            width: 100%;
            max-width: 1050px;
            max-height: 82vh;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
            object-fit: contain;
            margin-bottom: 20px;
        }
        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 13px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .back { background: #334155; color: #fff; }
        .wa { background: #25D366; color: #fff; }
        .btn:hover { transform: scale(1.04); }
    </style>
</head>
<body>
    <img src="beauty.jpg" alt="عالم الجمال والأنوثة">
    <div class="actions">
        <a href="index.html" class="btn back">⬅ العودة للرئيسية</a>
        <a href="https://wa.me/22200000000?text=مرحباً،%20أريد%20الطلب%20من%20قسم%20الجمال%20والأنوثة" class="btn wa">تواصل واتساب</a>
    </div>
</body>
</html>
