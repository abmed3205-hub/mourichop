<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرك الشامل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: #0f172a; color: #fff; }

        .feed {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gallery-item {
            width: 100%;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        .whatsapp-box {
            margin: 14px 0 24px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            padding: 14px 32px;
            border-radius: 50px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: 0.25s;
        }

        .btn-whatsapp:hover { transform: scale(1.02); }
    </style>
</head>
<body>

    <main class="feed">
        <!-- 1. الصورة الأولى: شحن دولي عالمي -->
        <div id="sec-shipping" class="gallery-item">
            <img src="shipping.jpg" alt="شحن دولي عالمي">
        </div>

        <!-- 2. الصورة الثانية: المتجر -->
        <div id="sec-store" class="gallery-item">
            <img src="store.jpg" alt="متجر شامل">
        </div>

        <!-- 3. الصورة الثالثة: عالم الجمال والأنوثة -->
        <div id="sec-beauty" class="gallery-item">
            <img src="beauty.jpg" alt="عالم الجمال والأنوثة">
        </div>

        <!-- زر واتساب واحد في الأسفل -->
        <div class="whatsapp-box">
            <a href="https://wa.me/22200000000?text=مرحباً،%20أريد%20الطلب%20والاستفسار" class="btn-whatsapp">تواصل واتساب</a>
        </div>
    </main>

    <script>
        let userScrolled = false;

        window.addEventListener('scroll', () => {
            if (window.scrollY > 80) {
                userScrolled = true;
            }
        });

        setTimeout(() => {
            if (!userScrolled) {
                const nextSec = document.getElementById('sec-store');
                if (nextSec) nextSec.scrollIntoView({ behavior: 'smooth' });
            }
        }, 40000);
    </script>

</body>
</html>
