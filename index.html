<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجرك العالمي الشامل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: #0f172a; color: #fff; }

        .section-card {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-bottom: 2px solid #1e293b;
        }

        .section-card img {
            width: 100%;
            max-width: 1000px;
            max-height: 82vh;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
            object-fit: contain;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            padding: 14px 34px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            transition: 0.3s;
            text-align: center;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            min-width: 220px;
        }

        .btn:hover { transform: scale(1.04); }
    </style>
</head>
<body>

    <!-- 1. القسم الأول: شحن دولي عالمي -->
    <section id="sec-shipping" class="section-card">
        <img src="shipping.jpg" alt="شحن دولي عالمي">
        <div class="actions">
            <a href="https://wa.me/22200000000?text=مرحباً،%20أريد%20الاستفسار%20عن%20الشحن%20الدولي" class="btn btn-whatsapp">تواصل واتساب</a>
        </div>
    </section>

    <script>
        let userScrolled = false;

        window.addEventListener('scroll', () => {
            if (window.scrollY > 100) {
                userScrolled = true;
            }
        });

        setTimeout(() => {
            if (!userScrolled) {
                const nextSec = document.getElementById('sec-global');
                if (nextSec) nextSec.scrollIntoView({ behavior: 'smooth' });
            }
        }, 40000);
    </script>

</body>
</html>
